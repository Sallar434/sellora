  function normRoute(r) {
    if (!r) return 'home';
    if (r.charAt(0) === '#') r = r.slice(1);
    try { r = decodeURIComponent(r); } catch(e) {}
    r = r.trim().toLowerCase();
    if (ROUTE_ALIASES[r]) return ROUTE_ALIASES[r];
    var slug = r.replace(/[\s_]+/g, '-');
    if (ROUTE_ALIASES[slug]) return ROUTE_ALIASES[slug];
    return slug;
  }

      if (item.sub) {
        var isSub = item.sub.some(function(s) { 
          return s.id === cur || s.alias === cur; 
        });
        if (isSub || item.id === cur) {
          S.navOpen[item.id] = true;
        }
      }
    });

    var html = NAV_CONFIG.map(function(item) {
      if (item.id === '--') {
        return '<div class="grp">' + item.label + '</div>';
      }
      var iconSvg = NAV_ICONS[item.icon] || '';
      if (item.sub) {

        var isDirectOn = item.id === cur;
        var hasActiveSub = item.sub.some(function(s) { return s.id === cur || s.alias === cur; });
        var headClass = 'nav-head' + (isDirectOn ? ' on' : '') + (hasActiveSub ? ' sub-on' : '');

  // --- PRODUCTS ---
  // Bulletproof pSave preventing circular Range errors
  window.pSave = function() {
    if (!P) P = pDraft();
    var o = P;
    delete o._rng;
    delete o._x;
    delete o._d;

    var nameInp = document.querySelector('#pfw input[data-pf="name"]');
    var nm = (nameInp ? nameInp.value.trim() : '') || (o.name ? o.name.trim() : '');
    if (!nm) {
      toast('Enter a title for the product');
      if (nameInp) nameInp.focus();
      return;
    }

    var priceInp = document.querySelector('#pfw input[data-pf="price"]');
    var pr0 = parseFloat(priceInp ? priceInp.value : o.price);
    if (isNaN(pr0) || pr0 < 0) pr0 = 0;

    var pedt = document.querySelector('#pedt');
    var pedh = document.querySelector('#pedh');
    if (pedh && pedh.style.display !== 'none') o.dh = pedh.value;
    else if (pedt) o.dh = pedt.innerHTML;

    var dh = typeof clean === 'function' ? clean(o.dh || '') : (o.dh || '');
    var descText = typeof plain === 'function' ? plain(dh) : dh.replace(/<[^>]*>/g, '').trim();
    var la = typeof locs === 'function' ? locs().filter(function(l){ return l.active; }) : [];
    var stock = 0, price = pr0;

    if (o.vars && o.vars.length) {
      var ps = o.vars.map(function(v){ return parseFloat(v.price); }).filter(function(n){ return !isNaN(n); });
      if (ps.length) price = Math.min.apply(null, ps);
      stock = o.vars.reduce(function(a, v){ return a + (+v.qty || 0); }, 0);
    } else {
      la.forEach(function(l){ stock += +o.qtys[l.id] || 0; });
    }
    if (!o.track) stock = 9999;

    var rec = {
      name: nm,
      price: price,
      stock: stock,
      dh: dh,
      desc: descText,
      imgs: (o.imgs || []).slice(),
      cat: o.cat || '',
      cmp: o.cmp || '',
      cost: o.cost || '',
      unit: o.unit || '',
      tax: o.tax !== false,
      track: o.track !== false,
      qtys: Object.assign({}, o.qtys || {}),
      sku: o.sku || '',
      barcode: o.barcode || '',
      oos: !!o.oos,
      phys: o.phys !== false,
      pkg: o.pkg || 'Store default',
      L: o.L || '',
      W: o.W || '',
      H: o.H || '',
      du: o.du || 'cm',
      wt: o.wt || '',
      wu: o.wu || 'kg',
      coo: o.coo || '',
      hs: o.hs || '',
      vendor: o.vendor || '',
      type: o.type || '',
      cols: (o.cols || []).slice(),
      tags: (o.tags || []).slice(),
      pub: o.pub !== false,
      status: o.status || 'Active',
      tmpl: o.tmpl || 'Default product',
      mf: Object.assign({}, o.mf || {}),
      opts: JSON.parse(JSON.stringify(o.opts || [])),
      vars: JSON.parse(JSON.stringify(o.vars || [])),
      seoT: o.seoT || '',
      seoD: o.seoD || '',
      seoH: o.seoH || ''
    };

    (rec.cols || []).forEach(function(c){
      S.cols = S.cols || [];
      if (S.cols.indexOf(c) < 0) S.cols.push(c);
    });

    if (PI) {
      var p = prod(PI);
      if (p) Object.assign(p, rec);
    } else {
      rec.id = S.nid++;
      S.products.push(rec);
    }

    P = null;
    PI = null;
    location.hash = 'products';
    route();
    toast('Product saved successfully');
  };

        }).join('') +

      '</select>' +
      '<h3 style="margin:16px 0 6px">Search engine listing (SEO)</h3>' +
      '<div class="seop" style="margin-bottom:12px">' +
        '<div class="seot" id="col-seo-prev-t">' + esc(col.metaTitle || col.title || 'Collection title') + '</div>' +
        '<div class="seou">' + esc(slug()) + '.sellora.app › collections › <span id="col-seo-prev-h">' + esc(col.handle || 'collection-handle') + '</span></div>' +
        '<div class="seod" id="col-seo-prev-d">' + esc(col.metaDesc || col.desc || 'Collection description for search engine ranking.') + '</div>' +
      '</div>' +
      '<label>Meta title (SEO Title)</label><input id="col-meta-title" maxlength="70" placeholder="Up to 70 characters" value="' + esc(col.metaTitle || '') + '">' +
      '<label>Meta description (SEO Description)</label><textarea id="col-meta-desc" maxlength="160" rows="2" placeholder="Up to 160 characters">' + esc(col.metaDesc || '') + '</textarea>' +
      '<label>URL handle</label><input id="col-handle" placeholder="collection-slug" value="' + esc(col.handle || '') + '">' +
      '<div class="acts"><button class="btn" id="m0">Cancel</button><button class="btn pri" id="col-save">Save collection</button></div>');

    $('#box').style.width = 'min(580px, 100%)';
    $('#m0').onclick = closeM;

    // Picture file handler
    var picInput = $('#col-pic-file');
    if (picInput) {
      picInput.onchange = function() {
        var file = this.files[0];
        if (!file) return;
        rz(file, 600).then(function(base64) {
          curPic = base64;
          var prev = $('#col-pic-prev');
          if (prev) {
            prev.style.backgroundImage = 'url(' + base64 + ')';
            prev.innerHTML = '';
          }
        }, function() { toast('Could not read image file'); });
      };
    }

    // Presets click handler
    document.querySelectorAll('[data-col-preset]').forEach(function(imgEl) {
      imgEl.onclick = function() {
        curPic = imgEl.dataset.colPreset;
        var prev = $('#col-pic-prev');
        if (prev) {
          prev.style.backgroundImage = 'url(' + curPic + ')';
          prev.innerHTML = '';
        }
      };
    });

    var picRm = $('#col-pic-rm');
    if (picRm) {
      picRm.onclick = function() {
        curPic = '';
        var prev = $('#col-pic-prev');
        if (prev) {
          prev.style.backgroundImage = '';
          prev.innerHTML = '<span style="font-size:20px;opacity:.5">📷</span>';
        }
      };
    }

    // Live SEO preview sync
    var titleInp = $('#col-title');
    var metaT = $('#col-meta-title');
    var descInp = $('#col-desc');
    var metaD = $('#col-meta-desc');
    var handleInp = $('#col-handle');

    function syncSEO() {
      var t = metaT.value.trim() || titleInp.value.trim() || 'Collection title';
      var d = metaD.value.trim() || descInp.value.trim() || 'Collection description for search engine ranking.';
      var h = handleInp.value.trim() || titleInp.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
      $('#col-seo-prev-t').textContent = t;
      $('#col-seo-prev-d').textContent = d;
      $('#col-seo-prev-h').textContent = h;
    }

    titleInp.oninput = function() {
      if (!handleInp.dataset.touched) {
        handleInp.value = titleInp.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
      }
      syncSEO();
    };
    handleInp.oninput = function() { handleInp.dataset.touched = '1'; syncSEO(); };
    metaT.oninput = syncSEO;
    descInp.oninput = syncSEO;
    metaD.oninput = syncSEO;

    $('#col-save').onclick = function() {
      var title = $('#col-title').value.trim();
      if (!title) { toast('Collection title is required'); return; }
      var h = handleInp.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-') || title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      var entry = {
        id: isEdit ? col.id : Date.now(),
        title: title,
        pic: curPic,
        desc: $('#col-desc').value.trim(),
        type: $('#col-type').value,
        handle: h,
        metaTitle: $('#col-meta-title').value.trim(),
        metaDesc: $('#col-meta-desc').value.trim(),
        products: col.products || S.products.length
      };

      if (isEdit) {
        S.collections[idx] = entry;
      } else {
        S.collections.push(entry);
      }

      closeM();
      route();
      toast(isEdit ? 'Collection updated' : 'Collection created');
    };
  }

  // 6. Global Modals & Actions
  document.addEventListener('click', function(e) {
    var t = e.target;

    // Quick add product
    if (t.id === 'btn-quick-p' || t.id === 'btn-quick-p2') {
      quickAddProductModal();
      return;
    }

    // Add product button on products page
    if (t.id === 'addp') {
      prodForm();
      return;
    }

    // Collections Add & Edit & Delete
    if (t.id === 'btn-add-col') {
      colModal();
      return;
    }

    var actCol = t.closest('[data-act-col]');
    if (actCol) {
      var parts = actCol.dataset.actCol.split(':');
      var act = parts[0];
      var idx = +parts[1];
      if (act === 'edit') {
        colModal(idx);
      } else if (act === 'del') {
        S.collections.splice(idx, 1);
        route();
        toast('Collection removed');
      }
      return;
    }

    // Draft orders actions
    if (t.id === 'btn-add-draft') {
      var prodOpts = S.products.map(function(p){return '<option value="' + p.id + '">' + esc(p.name) + ' (' + money(p.price) + ')</option>'}).join('');
      openM('<h2>Create draft order</h2>' +
        '<label>Customer name</label><input id="do-cust" placeholder="e.g. Zainab Bibi">' +
        '<label>Select product</label><select id="do-prod">' + prodOpts + '</select>' +
        '<label>Quantity</label><input id="do-qty" type="number" min="1" value="1">' +
        '<label>Status</label><select id="do-st"><option>Open</option><option>Invoice sent</option></select>' +
        '<div class="acts"><button class="btn" id="m0">Cancel</button><button class="btn pri" id="do-save">Save draft</button></div>');
      $('#m0').onclick = closeM;
      $('#do-save').onclick = function() {
        var cust = $('#do-cust').value.trim() || 'Guest Customer';
        var pid = +$('#do-prod').value;
        var p = prod(pid) || S.products[0];
        var qty = Math.max(1, +$('#do-qty').value || 1);
        var st = $('#do-st').value;
        S.draftOrders.unshift({
          id: 'D' + Math.floor(100 + Math.random() * 900),
          customer: cust,
          date: 'Just now',
          items: qty,
          total: p.price * qty,
          status: st
        });
        closeM();
        route();
        toast('Draft order created');
      };
      return;
    }

    var actDraft = t.closest('[data-act-draft]');
    if (actDraft) {
      var idx = +actDraft.dataset.actDraft.split(':')[1];
      var d = S.draftOrders[idx];
      d.status = 'Completed';
      S.orders.push({
        id: S.oid++,
        who: d.customer,
        total: d.total,
        st: 'Paid',
        gw: 'Sellora Pay'
      });
      route();
      toast('Draft completed and converted to active order');
      return;
    }

    // Abandoned recovery email
    var actAb = t.closest('[data-act-ab]');
    if (actAb) {
      var i = +actAb.dataset.actAb.split(':')[1];
      S.abandonedCheckouts[i].recovery = 'Email sent';
      route();
      toast('Recovery email sent to ' + S.abandonedCheckouts[i].email);
      return;
    }

    // Simulate checkout
    if (t.id === 'btn-sim-ck') {
      var names = ['Omar Farooq', 'Sania Mirza', 'Tariq Jameel', 'Zayd Malik'];
      var steps = ['Cart review', 'Contact details', 'Shipping address', 'Payment method'];
      S.checkoutsList.unshift({
        id: 'CK-' + Math.floor(100 + Math.random() * 900),
        customer: names[Math.floor(Math.random() * names.length)],
        step: steps[Math.floor(Math.random() * steps.length)],
        total: Math.floor(25 + Math.random() * 85),
        time: 'Just now',
        ip: '182.185.' + Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255)
      });
      route();
      toast('Simulated new active checkout session');
      return;
    }

    // Save inventory changes
    if (t.id === 'btn-save-inv') {
      document.querySelectorAll('[data-inv-p]').forEach(function(inp) {
        var pid = +inp.dataset.invP;
        var p = prod(pid);
        if (p) p.stock = Math.max(0, +inp.value || 0);
      });
      route();
      toast('Inventory levels updated');
      return;
    }

    // Purchase orders
    if (t.id === 'btn-add-po') {
      openM('<h2>Create purchase order</h2>' +
        '<label>Supplier name</label><input id="po-sup" placeholder="Supplier or manufacturer">' +
        '<label>Destination location</label><input id="po-dest" value="Main location">' +
        '<label>Expected delivery date</label><input id="po-exp" placeholder="e.g. Nov 15, 2026">' +
        '<label>Total cost (USD)</label><input id="po-tot" type="number" min="0" value="500">' +
        '<div class="acts"><button class="btn" id="m0">Cancel</button><button class="btn pri" id="po-save">Create PO</button></div>');
      $('#m0').onclick = closeM;
      $('#po-save').onclick = function() {
        var sup = $('#po-sup').value.trim();
        if (!sup) { toast('Supplier name is required'); return; }
        S.purchaseOrders.unshift({
          id: 'PO-' + Math.floor(100 + Math.random() * 900),
          supplier: sup,
          destination: $('#po-dest').value.trim() || 'Main location',
          status: 'Ordered',
          expected: $('#po-exp').value.trim() || 'Nov 20, 2026',
          total: +$('#po-tot').value || 500
        });
        closeM();
        route();
        toast('Purchase order created');
      };
      return;
    }

    var actPO = t.closest('[data-act-po]');
    if (actPO) {
      var i = +actPO.dataset.actPo.split(':')[1];
      S.purchaseOrders[i].status = 'Received';
      (S.products||[]).filter(function(p){return p.status!=='Archived'}).slice(0,1).forEach(function(p){p.stock=(+p.stock||0)+25});
      route();
      toast('Purchase order received & stock updated');
      return;
    }

    // Transfers
    if (t.id === 'btn-add-tr') {
      openM('<h2>Create transfer</h2>' +
        '<label>Origin location</label><input id="tr-orig" value="Main location">' +
        '<label>Destination location</label><input id="tr-dest" placeholder="e.g. Lahore Outlet">' +

// Event Handlers and Storefront Integration for Apps
(function(){
  document.addEventListener('click', function(e) {
    var t = e.target;

    // Search filter for App Store
    var searchInp = document.getElementById('app-search-input');
    if (searchInp && (t.id === 'app-search-input' || t.closest('.tools'))) {
      searchInp.oninput = function() {
        window._appSearchQuery = this.value;
        if (location.hash === '#apps-marketplace' || location.hash === '#apps') {
          var y = scrollY;
          var main = document.getElementById('main');
          if (main) main.innerHTML = V['apps-marketplace']();
          scrollTo(0, y);
          var newInp = document.getElementById('app-search-input');
          if (newInp) { newInp.focus(); newInp.setSelectionRange(newInp.value.length, newInp.value.length); }
        }
      };
    }

    // Category Pill Filter
    var pill = t.closest('[data-app-cat]');
    if (pill) {
      window._appCatFilter = pill.dataset.appCat;
      route();
      return;
    }

    // Install app from store
    var instBtn = t.closest('[data-act-install]');
    if (instBtn) {
      var id = instBtn.dataset.actInstall;
      var catItem = (S.appCatalog || []).find(function(x){ return x.id === id; });
      if (catItem) {
        catItem.installed = true;
        S.installedApps = S.installedApps || [];
        if (!S.installedApps.some(function(x){ return x.id === id; })) {
          S.installedApps.push({
            id: catItem.id,
            name: catItem.name,
            category: catItem.cat,
            icon: catItem.icon,
            desc: catItem.desc,
            status: 'Active',
            version: 'v1.0.0',
            route: catItem.route
          });
        }
        save();
        route();
        toast(catItem.name + ' installed successfully!');
      }
      return;
    }

    // Uninstall app
    var uninstBtn = t.closest('[data-app-uninstall]');
    if (uninstBtn) {
      var uId = uninstBtn.dataset.appUninstall;
      S.installedApps = (S.installedApps || []).filter(function(x){ return x.id !== uId; });
      var catEntry = (S.appCatalog || []).find(function(x){ return x.id === uId; });
      if (catEntry) catEntry.installed = false;
      save();
      route();
      toast('App uninstalled');
      return;
    }

    // Delete custom app
    var delCustom = t.closest('[data-custom-app-del]');
